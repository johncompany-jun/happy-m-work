name: Build & FTP Deploy

on:
  push:
    branches: [ main ]            
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for the manual run"
        required: false
        default: "manual"
  repository_dispatch:
    types: [ microcms-update ]    

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_API_VERSION: ${{ secrets.MICROCMS_API_VERSION }}
          MICROCMS_BLOG_ENDPOINT: ${{ secrets.MICROCMS_BLOG_ENDPOINT }}
          PUBLIC_GA_MEASUREMENT_ID: G-RBG9BJ7H23
        run: npm run build

      - name: Deploy via FTP (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          local-dir:  ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          protocol: ftps
          security: loose
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            koemado/**

      - name: Wait 30s before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy via FTP (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          local-dir:  ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          protocol: ftps
          security: loose
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            koemado/**

      - name: Wait 60s before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy via FTP (attempt 3 - final)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          local-dir:  ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          protocol: ftps
          security: loose
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            koemado/**